let state;
try{state={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){state={...initial}}
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function set(k,v){if(k==='city'&&state.city!==v){state.zone=null;state.segment='';state.competitors=[]}if(k==='zone'&&state.zone!==v){state.competitors=[]}state[k]=v;save();render()}
function update(k,v){state[k]=v;if(state.step===5)state.finished=false;save()}
function toggleCity(id){if(state.cities.includes(id)){state.cities=state.cities.filter(x=>x!==id);if(state.city===id){state.city='';state.zone=null;state.competitors=[]}}else if(state.cities.length<2)state.cities.push(id);save();render()}
function toggleComp(i){if(state.competitors.includes(i))state.competitors=state.competitors.filter(x=>x!==i);else if(state.competitors.length<3)state.competitors.push(i);save();render()}
function choice(label,value,selected,fn,details=''){return `<button type="button" class="choice ${selected?'selected':''}" onclick="${fn}"><strong>${selected?'✓ ':''}${esc(label)}</strong>${details?`<div class="muted">${details}</div>`:''}</button>`}
function field(key,label,placeholder='',rows=3){let val=esc(state[key]);return `<label for="f_${key}">${esc(label)}</label><textarea id="f_${key}" rows="${rows}" placeholder="${esc(placeholder)}" oninput="update('${key}',this.value)">${val}</textarea>`}
function short(key,label,placeholder=''){return `<label for="f_${key}">${esc(label)}</label><input id="f_${key}" value="${esc(state[key])}" placeholder="${esc(placeholder)}" oninput="update('${key}',this.value)">`}
function actions(back=true,next='Continue'){return `<div class="actions">${back?'<button class="secondary" onclick="back()">← Back</button>':'<span></span>'}<button class="primary" onclick="next()">${esc(next)} →</button></div><div class="error" id="error" role="alert"></div>`}

function zoneType(id,i){let n=CITIES[id].locations[i][0].toLowerCase();return /campus|university|college/.test(n)?'students':/office|business|loop|medical|tech|midtown/.test(n)?'professionals':'visitors'}
function zoneInfo(id,i){let c=CITIES[id],l=c.locations[i],primary=zoneType(id,i);let mix=primary==='students'?{students:55,professionals:25,visitors:20}:primary==='professionals'?{students:15,professionals:70,visitors:15}:{students:15,professionals:20,visitors:65};return {name:l[0],traffic:Math.round(c.customers*l[1]),spend:Math.round(c.spend*l[2]),cost:Math.round((3400+c.cost*450)*l[3]),competition:Math.min(10,c.competition+(primary==='visitors'?1:0)),mix,description:l[4]}}
function competitorList(){
 let all=COMP[state.city]||[], reg=REGIONAL_COMPETITORS[state.city]||[];
 let z=Number(state.zone), indices=z===0?[0,1,2]:z===1?[1,3,4]:[0,2,5];
 let count=z===0?3:z===1?1:0;
 let zoneSpecific=reg.slice(0,count).map((a,j)=>({i:'regional_'+j,a}));
 let general=indices.concat([0,1,2,3,4,5]).filter((v,i,a)=>a.indexOf(v)===i).slice(0,6-count).map(i=>({i:'general_'+i,a:all[i]}));
 return [...zoneSpecific,...general];
}

const EVAL_CRITERIA=[
 {name:'Market Analysis',keys:['cityReason','zoneReason'],hint:'Support your city, zone, and audience choices with specific market statistics and a comparison.'},

function evaluate(){
 const city=CITIES[state.city]||{}, zone=state.zone===null?null:zoneInfo(state.city,Number(state.zone));
 const competitorNames=(state.competitors||[]).map(i=>competitorList().find(x=>x.i===i)?.a?.[0]).filter(Boolean);
 const hasNumber=t=>/\b\d+(?:[.,]\d+)?\b|%|\$/i.test(t);
 const hasEvidence=t=>/\b(because|compared|while|according|review|price|cost|traffic|spend|competition|wait|rating|customer|student|visitor|professional|demand|budget|zone|market|minutes|percent)\b/i.test(t);
 const includesWord=(t,w)=>w&&t.toLowerCase().includes(w.toLowerCase());
 let market=[state.cityReason,state.zoneReason].join(' ').trim();
 let competition=[state.competitionInsight,state.advantage].join(' ').trim();
 let product=[state.foodDescription,state.customerValue].join(' ').trim();
 const cityNames=(state.cities||[]).map(id=>CITIES[id]?.name).filter(Boolean);
 const marketSpecific=hasNumber(market)||cityNames.some(n=>includesWord(market,n))||includesWord(market,zone?.name)||hasEvidence(market);
 const compSpecific=competitorNames.some(n=>includesWord(competition,n))||hasNumber(competition)||/\b(review|wait|price|rating|portion|quality|service|complaint|strength|weakness)\b/i.test(competition);
 const productSpecific=includesWord(product,state.segment?SEGMENTS[state.segment]?.name:'')||/\b(student|worker|tourist|visitor|professional|customer|audience|target|need|gap|competitor|market|location|zone|because)\b/i.test(product);
 function grade(textA,textB,specific,depth){
   const a=String(textA||'').trim(),b=String(textB||'').trim();
   const words=t=>(t.toLowerCase().match(/[a-z]+(?:'[a-z]+)?|\d+(?:[.,]\d+)*/g)||[]);
   const meaningful=t=>{
     const w=words(t), distinct=new Set(w.filter(x=>x.length>=3));
     // Repeated letters, filler, and tiny fragments are not evidence of learning.
     return w.length>=8 && distinct.size>=6 && t.length>=45 && !/^(.)\1+$/i.test(t.replace(/\s/g,''));
   };
   if(!meaningful(a)||!meaningful(b))return 0;
   const combined=a+' '+b, w=words(combined);
   const distinct=new Set(w.filter(x=>x.length>=3));
   if(w.length<35||distinct.size<18)return 1;
   if(!specific||w.length<55||distinct.size<28)return 1;
   if(!depth||w.length<85||distinct.size<40)return 2;
   return 3;
 }

 const result=[
  {name:'Market Analysis',score:grade(state.cityReason||'',state.zoneReason||'',marketSpecific,hasNumber(market)&&/\b(because|compared|while|however|than|tradeoff|risk)\b/i.test(market)),hint:EVAL_CRITERIA[0].hint,keys:EVAL_CRITERIA[0].keys},
  {name:'Competitive Analysis',score:grade(state.competitionInsight||'',state.advantage||'',compSpecific,/\b(because|compared|while|however|than|therefore|so that)\b/i.test(competition)),hint:EVAL_CRITERIA[1].hint,keys:EVAL_CRITERIA[1].keys},
  {name:'Product Development',score:grade(state.foodDescription||'',state.customerValue||'',productSpecific,/\b(because|compared|while|unlike|instead|so that|by offering)\b/i.test(product)),hint:EVAL_CRITERIA[2].hint,keys:EVAL_CRITERIA[2].keys}
 ];
 return {criteria:result,total:result.reduce((n,r)=>n+r.score,0)};
}
function weatherAdvancedFeedback(){const t=String(state.weatherStrategy||'').trim();if(!t)return '<p class="muted">Advanced evidence: not attempted.</p>';const w=WEATHER_PROFILES[state.city];const mentionsRisk=/\b(weather|rain|storm|heat|hot|humid|snow|cold|wind|winter|summer|hurricane|season|temperature|ice)\b/i.test(t);const mentionsAction=/\b(would|will|plan|offer|provide|adjust|move|schedule|cover|shade|pickup|deliver|partner|operate|hours|location|shelter|tent|indoor)\b/i.test(t);const mentionsReason=/\b(because|so that|to help|customer|traffic|sales|demand|zone|audience|workers|students|tourists|visitors)\b/i.test(t);return `<p class="muted"><b>Provisional advanced check:</b> ${mentionsRisk&&mentionsAction&&mentionsReason&&t.length>=100?'Strong evidence of an advanced weather response. Teacher review required.':'Developing — identify a specific weather risk, explain an actionable response, and connect it to customers or business results.'}</p>`}

e="radio" name="advancedChoice" value="attempt" ${state.advancedChoice==='attempt'?'checked':''} onchange="setAdvancedChoice('attempt')"> Attempt Advanced (2 points possible)</label><label><input type="radio" name="advancedChoice" value="blank" ${state.advancedChoice==='blank'?'checked':''} onchange="setAdvancedChoice('blank')"> Leave Advanced Blank (0/2)</label></div><p class="muted">Choose an option before you can run your provisional score. Advanced is separate from the three proficiency criteria.</p></div>${field('weatherStrategy','Your weather response strategy','In my selected city, ... could affect ... Our food truck would ... because ...',4)}${weatherAdvancedFeedback()}${e?`<p><b>Provisional advanced score: ${advancedScore()}/2</b></p>`:''}</div>

 ${state.revisionBaseline?`<div class="notice"><b>Revision tracking is on.</b> Your first evaluated answers are saved as a baseline. When you download the PDF, it will show each changed answer side by side with its original version, plus the first and latest provisional scores. <b>${revisionChanges().length} response(s) changed.</b></div>`:''}<h2>Revise your existing responses</h2><p class="muted">Changes here replace your original answers in the proposal. Reevaluate after editing.</p>
 <div id="rev0" class="stat"><h3>1. Market Analysis</h3>${field('cityReason','Why did you choose this city?','Use evidence from your two-city comparison.',4)}${field('zoneReason','Why does your selling zone fit your target customers?','Use traffic, spending, and customer information.',4)}</div>

 <div id="rev2" class="stat" style="margin-top:12px"><h3>3. Product Development</h3>${short('foodType','Type of food')}${field('foodDescription','Describe your food truck concept.','Explain what customers will get.',4)}${field('customerValue','How does your concept address the opportunity?','Connect the concept to the market and competition.',4)}</div>

function focusRevision(i){document.getElementById('rev'+i)?.scrollIntoView({behavior:'smooth',block:'center'});const k=EVAL_CRITERIA[i].keys[0];document.getElementById('f_'+k)?.focus({preventScroll:true})}
function setAdvancedChoice(v){state.advancedChoice=v;if(v==='blank')state.weatherStrategy='';state.evaluationSeen=false;save();render();document.getElementById('advancedChoiceBlock')?.scrollIntoView({block:'center'});}
function advancedScore(){
 if(state.advancedChoice!=='attempt')return 0;
 const t=String(state.weatherStrategy||'').trim();
 const risk=/\b(weather|rain|storm|heat|hot|humid|snow|cold|wind|winter|summer|hurricane|season|temperature|ice)\b/i.test(t);
 const action=/\b(would|will|plan|offer|provide|adjust|move|schedule|cover|shade|pickup|deliver|partner|operate|hours|location|shelter|tent|indoor)\b/i.test(t);
 const impact=/\b(because|so that|to help|customer|traffic|sales|demand|zone|audience|workers|students|tourists|visitors)\b/i.test(t);
 if(t.length<45||!risk||!action)return 0;
 return t.length>=100&&impact?2:1;
}

 if(!choice){const el=document.getElementById('error');if(el)el.textContent='Choose Attempt Advanced or Leave Advanced Blank before running the provisional score.';document.getElementById('advancedChoiceBlock')?.scrollIntoView({behavior:'smooth',block:'center'});return;}
 if(choice==='attempt'&&!String(state.weatherStrategy||'').trim()){const el=document.getElementById('error');if(el)el.textContent='Write your advanced response, or choose Leave Advanced Blank.';document.getElementById('advancedChoiceBlock')?.scrollIntoView({behavior:'smooth',block:'center'});return;}
 if(choice==='blank'){state.weatherStrategy='';}
 if(!state.revisionBaseline){state.revisionBaseline={answers:Object.fromEntries(REVISION_FIELDS.map(([k])=>[k,String(state[k]||'')])),scores:evaluate().criteria.map(r=>r.score),total:evaluate().total,advanced:advancedScore()};}state.evaluationSeen=true;state.finished=false;save();render();document.querySelector('.panel')?.scrollIntoView({behavior:'smooth'})}
function reportHtml(print){let c=CITIES[state.city]||{},z=c.locations?.[Number(state.zone)]?.[0]||'',seg=SEGMENTS[state.segment]?.name||'',comps=(state.competitors||[]).map(i=>competitorList().find(x=>x.i===i)?.a?.[0]).filter(Boolean);
return `<section><h2>Advanced Challenge: Weather Response Strategy (Optional)</h2><p><b>Status:</b> ${state.advancedChoice==='attempt'?'Attempted':'Left blank'} · <b>Provisional advanced score:</b> ${advancedScore()}/2</p><p>${esc(state.weatherStrategy||'Not attempted')}</p></section><section><h2>1. Market Research</h2><p><b>Cities compared:</b> ${state.cities.map(id=>esc(CITIES[id]?.name)).join(' and ')}</p><p><b>Selected city:</b> ${esc(c.name)}</p><p>${esc(state.cityReason)}</p><p><b>Selling zone:</b> ${esc(z)} · <b>Target customers:</b> ${esc(seg)}</p><p>${esc(state.zoneReason)}</p></section><section><h2>2. Competitive Analysis</h2><p><b>Competitors reviewed:</b> ${comps.map(esc).join(', ')}</p><p><b>Customer need or market gap:</b> ${esc(state.competitionInsight)}</p><p><b>Initial competitive strategy:</b> ${esc(state.advantage)}</p></section><section><h2>3. My Food Truck Concept</h2><p><b>Food type:</b> ${esc(state.foodType)}</p><p><b>Concept:</b> ${esc(state.foodDescription)}</p><p><b>How this meets the opportunity:</b> ${esc(state.customerValue)}</p></section>`;
}
function valid(){let t=x=>String(x||'').trim();switch(state.step){case 0:return t(state.name)?'':'Enter your name to begin.';case 1:return state.cities.length!==2?'Choose exactly two cities.':!state.city?'Recommend one of the two cities.':!t(state.cityReason)?'Explain your city choice.':'';case 2:return state.zone===null?'Choose a selling zone.':!state.segment?'Choose your target customers.':!t(state.zoneReason)?'Explain your location and target customer choice.':'';case 3:return state.competitors.length!==3?'Select three competitors.':!t(state.competitionInsight)?'Describe the customer need or market gap you discovered.':!t(state.advantage)?'Explain your initial competitive strategy.':'';case 4:return !t(state.foodType)?'Enter the type of food you want to serve.':!t(state.foodDescription)?'Describe your food truck concept.':!t(state.customerValue)?'Explain how your concept responds to the opportunity you found.':'';case 5:return '';default:return ''}}
function next(){let error=valid();if(error){let el=$('error');if(el)el.textContent=error;return}if(state.step===5){finish();return}state.step++;save();render();window.scrollTo(0,0)}
function back(){state.step=Math.max(0,state.step-1);save();render();window.scrollTo(0,0)}
function render(){if(state.step>1&&!CITIES[state.city])state.step=1; if(state.step>2&&state.zone===null)state.step=2;
$('steps').innerHTML=steps.map((s,i)=>`<span class="${i===state.step?'active':i<state.step?'done':''}">${i+1}. ${s}</span>`).join('');
$('studentBadge').textContent=state.name||'Student edition';$('app').innerHTML=screen();
if(state.step===5&&state.finished)showFinish()}
function finish(){if(!state.evaluationSeen){runEvaluation();return}state.finished=true;save();showFinish();$('finishArea')?.scrollIntoView({behavior:'smooth',block:'nearest'})}
function showFinish(){let el=$('finishArea');if(!el)return;el.innerHTML=`<div class="notice"><h2>Phase 1 Complete!</h2><p>Your proposal and provisional evaluation are ready. Download the PDF directly and submit it in Canvas. You can also use Print / Save as PDF if you prefer.</p><div class="actions"><button class="primary" onclick="downloadPDF()">⬇ Download PDF</button><button class="secondary" onclick="printReport()">Print / Save as PDF</button><button class="secondary" onclick="downloadReport()">Text backup</button></div></div>`}
const REVISION_FIELDS=[
 ['cityReason','City selection reasoning'],['zoneReason','Selling zone and target audience'],
 ['competitionInsight','Competitor research and market gap'],['advantage','Competitive strategy'],
 ['foodType','Food served'],['foodDescription','Food truck concept'],
 ['customerValue','How the concept meets the opportunity'],['weatherStrategy','Advanced weather strategy']
];
function revisionChanges(){
 const original=state.revisionBaseline?.answers;if(!original)return [];
 return REVISION_FIELDS.filter(([k])=>String(original[k]||'').trim()!==String(state[k]||'').trim()).map(([key,label])=>({key,label,before:String(original[key]||'').trim(),after:String(state[key]||'').trim()}));
}
function revisionSummaryHtml(){
 const changes=revisionChanges(),b=state.revisionBaseline;
 if(!b)return '<p>No initial evaluation was recorded.</p>';
 return `<section><h2>Revision History & Evidence of Improvement</h2><p><b>First provisional score:</b> ${b.total}/9 · <b>Current provisional score:</b> ${evaluate().total}/9</p>${changes.length?changes.map(x=>`<div style="margin:10px 0"><b>${esc(x.label)}</b><p><b>Original response:</b> ${esc(x.before||'(blank)')}</p><p><b>Revised response:</b> ${esc(x.after||'(blank)')}</p></div>`).join(''):'<p>No changes to the evaluated responses were recorded.</p>'}<p><i>Changes show the original and latest responses. The provisional score is automated; a teacher determines whether the revision improves the reasoning or evidence.</i></p></section>`;
}
function revisionPdfLines(){
 const b=state.revisionBaseline,changes=revisionChanges();
 if(!b)return [['REVISION HISTORY',true],['No initial evaluation snapshot recorded.',false]];
 return [['5. REVISION HISTORY AND EVIDENCE OF IMPROVEMENT',true],
 ['First provisional score: '+b.total+'/9 | Current provisional score: '+evaluate().total+'/9',false],
 ...(changes.length?changes.flatMap(x=>[
 [x.label.toUpperCase(),true],
 ['ORIGINAL: '+(x.before||'(blank)'),false],
 ['REVISED: '+(x.after||'(blank)'),false],
 ['',false]
 ]):[['No changes to the evaluated responses were recorded.',false]]),
 ['Teacher reviews whether the revisions improve the analysis.',false]];
}
function evaluationPrintHtml(){const e=evaluate();return `<section><h2>4. Provisional Market Scout Evaluation</h2><p><b>Automated writing check:</b> ${e.total}/9 · <b>Advanced Weather:</b> ${advancedScore()}/2</p>${e.criteria.map(r=>`<p><b>${esc(r.name)}:</b> ${r.score}/3 — ${r.score===3?'Proficient! Clear detail and supporting evidence are present.':esc(r.hint)}</p>`).join('')}<p><i>This is an automated, provisional check; the teacher assigns the final grade.</i></p></section>`}
function printReport(){if(!state.finished){alert('Finish Phase 1 before printing.');return}let html=`<h1>Food Truck Opportunity Proposal</h1><p><b>Student:</b> ${esc(state.name)} · <b>Class:</b> ${esc(state.section)}</p>${reportHtml(true)}${evaluationPrintHtml()}${revisionSummaryHtml()}<p style="font-size:9pt;color:#555">All market and competitor data are fictional classroom examples.</p>`;$('printArea').innerHTML=html;window.print()}

function pdfClean(x){return String(x??'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[\u2018\u2019]/g,"'").replace(/[\u2013\u2014]/g,'-').replace(/[\u201c\u201d]/g,'"').replace(/[^\x20-\x7E\n]/g,'?')}
function pdfEscape(x){return pdfClean(x).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)')}
function pdfLines(){let c=CITIES[state.city]||{},z=c.locations?.[Number(state.zone)]?.[0]||'',seg=SEGMENTS[state.segment]?.name||'';
let comp=state.competitors.map(i=>competitorList().find(x=>x.i===i)?.a?.[0]).filter(Boolean);
return [
['Food Truck Opportunity Proposal',true],['Student: '+state.name+'     Class: '+state.section,false],['Phase 1 | Marketing Concepts',false],['',false],
['1. MARKET RESEARCH',true],['Cities compared: '+state.cities.map(i=>CITIES[i]?.name).join(' and '),false],['Selected city: '+c.name,false],['Reason for city choice: '+state.cityReason,false],['Selling zone: '+z,false],['Target customers: '+seg,false],['Reason for location and audience: '+state.zoneReason,false],['',false],
['2. COMPETITIVE ANALYSIS',true],['Competitors reviewed: '+comp.join(', '),false],['Customer need or market gap: '+state.competitionInsight,false],['Initial competitive strategy: '+state.advantage,false],['',false],
['3. MY FOOD TRUCK CONCEPT',true],['Type of food: '+state.foodType,false],['Concept: '+state.foodDescription,false],['How this meets the opportunity: '+state.customerValue,false],['',false],
['ADVANCED CHALLENGE: WEATHER RESPONSE STRATEGY (OPTIONAL)',true],['Advanced status: '+(state.advancedChoice==='attempt'?'Attempted':'Left blank')+' | Provisional: '+advancedScore()+'/2',false],[state.weatherStrategy||'Not attempted',false],['',false],['4. PROVISIONAL MARKET SCOUT EVALUATION',true],['Automated writing check: '+evaluate().total+'/9',false],['Advanced Weather Response: '+advancedScore()+'/2 ('+(state.advancedChoice==='attempt'?'attempted':'left blank')+')',false],...evaluate().criteria.map(r=>[r.name+': '+r.score+'/3. '+(r.score===3?'Proficient! Clear detail and supporting evidence are present.':r.hint),false]),['Teacher assigns the final grade; automated scores are provisional.',false],['Market and competitor data are fictional classroom examples.',false],['',false],...revisionPdfLines()];
}
function downloadPDF(){
 const lines=[];for(const [raw,heading] of pdfLines()){
  let text=pdfClean(raw).replace(/\s+/g,' ').trim();if(!text){lines.push({text:'',heading:false});continue}
  let limit=heading?72:94;
  while(text.length>limit){let cut=text.lastIndexOf(' ',limit);if(cut<20)cut=limit;lines.push({text:text.slice(0,cut),heading});text=text.slice(cut).trim();}
  lines.push({text,heading});
 }
 const pages=[];for(let i=0;i<lines.length;i+=46)pages.push(lines.slice(i,i+46));
 const objects=[null];const add=x=>{objects.push(x);return objects.length-1};
 const catalog=add('');const pagesId=add('');const font=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');const pageIds=[];
 for(let p=0;p<pages.length;p++){
  let commands=['BT'];let y=752;
  for(const line of pages[p]){if(line.heading){commands.push('/F1 13 Tf')}else{commands.push('/F1 10 Tf')}commands.push(`1 0 0 1 54 ${y} Tm (${pdfEscape(line.text)}) Tj`);y-=line.heading?20:15}
  commands.push('ET');const stream=commands.join('\n')+'\n';const content=add(`<< /Length ${stream.length} >>\nstream\n${stream}endstream`);
  const page=add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 ${font} 0 R >> >> /Contents ${content} 0 R >>`);pageIds.push(page);
 }
 objects[catalog]=`<< /Type /Catalog /Pages ${pagesId} 0 R >>`;
 objects[pagesId]=`<< /Type /Pages /Kids [${pageIds.map(i=>i+' 0 R').join(' ')}] /Count ${pageIds.length} >>`;
 let pdf='%PDF-1.4\n';const offsets=[0];for(let i=1;i<objects.length;i++){offsets[i]=pdf.length;pdf+=`${i} 0 obj\n${objects[i]}\nendobj\n`}
 const start=pdf.length;pdf+=`xref\n0 ${objects.length}\n0000000000 65535 f \n`;for(let i=1;i<objects.length;i++)pdf+=`${String(offsets[i]).padStart(10,'0')} 00000 n \n`;
 pdf+=`trailer\n<< /Size ${objects.length} /Root ${catalog} 0 R >>\nstartxref\n${start}\n%%EOF`;
 const blob=new Blob([pdf],{type:'application/pdf'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Food_Truck_Phase_1_'+(state.name||'Student').trim().replace(/[^a-z0-9]+/gi,'_')+'.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
}

function plainReport(){let d=document.createElement('div');d.innerHTML=reportHtml(true);return `FOOD TRUCK OPPORTUNITY PROPOSAL\nStudent: ${state.name}\nClass: ${state.section}\n\n${d.innerText||d.textContent}\n\nAll market and competitor data are fictional classroom examples.`}
function downloadReport(){let blob=new Blob([plainReport()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='food_truck_phase_1_'+state.name.trim().replace(/\s+/g,'_')+'.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
render();
</script></body></html>
